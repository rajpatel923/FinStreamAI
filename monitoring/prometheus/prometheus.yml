global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: finstreami

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-services
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: data-ingestion
    static_configs:
      - targets: ["host.docker.internal:8001"]
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9101"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis:9121"]
